name: Pull request checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run cross-browser UI and research workspace acceptance
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source-launchers:
    name: Source startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test source launchers without installing application dependencies
        run: python scripts/test-source-launchers.py
      - name: Test npm discovery and build receipts
        run: node --test frontend/scripts/source-startup.test.mjs

  backend:
    name: Backend tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    # Separate runners isolate tests that prepare plugins, files and subprocesses.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            plugins/*/pyproject.toml
      - name: Sync locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-extras --group dev
      - name: Verify startup with only locked Core dependencies
        if: matrix.shard == 1
        run: |
          uv venv .tmp/core-only
          uv export --project backend --locked --no-dev --no-emit-project --no-hashes --output-file .tmp/core-requirements.txt
          uv pip install --python .tmp/core-only/bin/python -r .tmp/core-requirements.txt
          .tmp/core-only/bin/python scripts/check-core-startup.py
      - name: Install repository plugins
        working-directory: backend
        shell: bash
        run: |
          mapfile -t plugin_roots < <(
            find ../plugins -mindepth 2 -maxdepth 2 -name pyproject.toml -printf '%h\n' | sort
          )
          if ((${#plugin_roots[@]} == 0)); then
            echo "No repository plugin packages found" >&2
            exit 1
          fi
          install_args=()
          for plugin_root in "${plugin_roots[@]}"; do
            install_args+=(--editable "$plugin_root")
          done
          uv pip install --python .venv/bin/python "${install_args[@]}"
      - name: Prepare declared Report rendering test dependencies
        run: |
          backend/.venv/bin/python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path
          spec = tomllib.loads(Path('plugins/atomsculptor/oaw.pack.toml').read_text())
          requirements = spec['environments']['log-review']['python']
          subprocess.run(['uv', 'pip', 'install', '--python', 'backend/.venv/bin/python', *requirements], check=True)
          PY
      - name: Strict optional plugin activation
        run: backend/.venv/bin/python -c "from backend.plugins.loader import load_plugin_registry; load_plugin_registry(strict=True)"
      - name: Run backend and public SDK test suites
        run: >-
          backend/.venv/bin/python .github/run-backend-tests.py tests backend/tests packs/codex/tests
          plugins/atomsculptor/tests/test_log_review_agent.py
          --shard ${{ matrix.shard }}/6 --durations=20
          --junitxml=.tmp/backend-linux-${{ matrix.shard }}.xml
      - name: Upload backend results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-results-${{ matrix.shard }}
          path: .tmp/backend-linux-${{ matrix.shard }}.xml
          include-hidden-files: true
          retention-days: 7

  frontend-unit:
    name: Frontend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare SDK and Pack dependencies
        working-directory: frontend
        run: |
          npm run build:pack-sdk
          npm run prepare:packs
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            plugins/*/pyproject.toml
      - name: Install locked deployment backend
        run: uv sync --project backend --locked --dev --extra hosting --extra adk --extra litellm --python 3.12
      - name: Install operator-approved plugin dependencies for hosted workers
        run: >-
          backend/.venv/bin/python -c "from pathlib import Path; import subprocess, sys;
          subprocess.run(['uv', 'pip', 'install', '--python', sys.executable,
          *[str(p.parent) for p in sorted(Path('plugins').glob('*/pyproject.toml'))]], check=True)"
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify Pack build dependency boundaries
        working-directory: frontend
        run: npm run test:pack-sdk
      - name: Install Chromium for core browser acceptance
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Install WebKit for optional UI acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        working-directory: frontend
        run: npx --no-install playwright install --with-deps webkit
      - name: Pack the public SDK
        id: pack-sdk
        run: |
          mkdir -p .outputs
          npm pack ./frontend/pack-sdk --pack-destination .outputs --json > .outputs/pack-sdk.json
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const [sdk] = JSON.parse(readFileSync('.outputs/pack-sdk.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `path=.outputs/${sdk.filename}\nversion=${sdk.version}\n`);
          JS
      - name: Build external Greeter with the packaged SDK
        env:
          OAW_PACK_SDK: ${{ steps.pack-sdk.outputs.path }}
        run: backend/.venv/bin/python scripts/build-external-greeter.py --sdk "$OAW_PACK_SDK"
      - name: Install external Pack and verify cards and assets after restart
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e:packs
      - name: Upload the versioned public Pack SDK
        uses: actions/upload-artifact@v4
        with:
          name: oaw-plugin-api-${{ steps.pack-sdk.outputs.version }}-${{ github.sha }}
          path: ${{ steps.pack-sdk.outputs.path }}
          if-no-files-found: error
      - name: Build and install an external declarative Pack
        env:
          PLAYWRIGHT_CHANNEL: chromium
          OAW_PACK_SDK: ${{ steps.pack-sdk.outputs.path }}
        run: |
          backend/.venv/bin/python scripts/build-external-notes.py --sdk "$OAW_PACK_SDK"
          node frontend/scripts/run-pack-e2e.mjs --declarative
      - name: Run deployment acceptance against production frontend
        working-directory: frontend
        run: npm run test:e2e:deployment
      - name: Verify the published MatCreator workspace and shared card APIs
        if: github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        working-directory: frontend
        run: npm run test:e2e:publication
      - name: Verify hosted login and independent user workspaces
        working-directory: frontend
        run: npm run test:e2e:hosting
      - name: Verify shared UI in Chromium and WebKit
        if: github.event_name == 'workflow_dispatch' && inputs.full_acceptance
        working-directory: frontend
        run: npm run test:e2e:ui
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-browser-failure
          path: |
            .tmp/deployment-playwright/
            .tmp/publication-playwright/
            .tmp/deployment-desktop.png
            .tmp/deployment-mobile.png
            .tmp/hosting-playwright/
            .tmp/hosting-login.png
            .tmp/hosting-canvas.png
            .tmp/ui-playwright/
            .outputs/pack-acceptance/
          include-hidden-files: true
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [source-launchers, backend, frontend-unit, frontend, windows-smoke, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; results=json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'

  version:
    name: Application version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/check-release.py

  windows-smoke:
    name: Core smoke (Windows)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            plugins/*/pyproject.toml
      - name: Install locked backend dependencies
        run: uv sync --project backend --locked --all-extras --group dev --python 3.12
      - name: Install repository plugin test dependencies
        run: >-
          backend/.venv/Scripts/python.exe -c "from pathlib import Path; import subprocess, sys;
          subprocess.run(['uv', 'pip', 'install', '--python', sys.executable,
          *[str(p.parent) for p in sorted(Path('plugins').glob('*/pyproject.toml'))]], check=True)"
      - name: Check Windows source setup and dev launch contracts
        run: |
          ./scripts/test-dev-environment.ps1
          ./scripts/test-dev-startup.ps1
          ./scripts/test-desktop-build.ps1
      # OS-independent auth, API and deployment suites run in the Linux shards.
      - name: Check Windows startup, filesystem recovery, persistence and migration
        run: >-
          backend/.venv/Scripts/python.exe .github/run-backend-tests.py
          backend/tests/test_source_scripts.py
          backend/tests/test_plugin_setup.py
          backend/tests/test_lifecycle_migration.py
          backend/tests/test_storage_location.py
          backend/tests/test_windows_acceptance_helpers.py
          backend/tests/test_persistence_and_events.py::test_world_and_text_persist_across_restart
          backend/tests/test_application_launch.py::test_production_serves_built_assets_without_debug_endpoints
          backend/tests/test_application_launch.py::test_workspace_reset_removes_real_cards_and_restores_files_after_move_failure
          backend/tests/test_application_launch.py::test_interrupted_reset_restores_archived_directories_before_startup
          --durations=10 --junitxml=.tmp/windows-smoke.xml
      - name: Upload Windows results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-results
          path: .tmp/windows-smoke.xml
          include-hidden-files: true
          retention-days: 7
